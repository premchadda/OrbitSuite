name: orbitsuite
services:
  bot:
    build:
      context: .
      dockerfile: apps/local/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ORBIT_STORE: sqlite
      ORBIT_MODE: ${ORBIT_MODE:-polling}
      ORBIT_HOST: 0.0.0.0
      ORBIT_PORT: 8787
      ORBIT_DB_PATH: /data/orbitsuite.sqlite
    volumes:
      - orbit_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  media:
    profiles: ["media"]
    build:
      context: .
      dockerfile: services/media_worker/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: "service:bot"
    environment:
      ORBIT_CONTROL_URL: http://127.0.0.1:8787
      ORBIT_ALLOW_LOCAL_HTTP: "1"
      ORBIT_SERVICE_KEY: ${MEDIA_WORKER_KEY:?Set MEDIA_WORKER_KEY in .env}
    depends_on:
      bot:
        condition: service_healthy

volumes:
  orbit_data:
